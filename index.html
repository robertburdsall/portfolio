<main id="main">

  <div data-mount="hero"></div>

  <!-- Scrolling scope trace. The path is 16 periods wide, the viewBox shows 8,
       and it shifts exactly one period — so the loop is seamless. -->
  <div class="wave" aria-hidden="true">
    <svg viewBox="0 0 480 40" preserveAspectRatio="none">
      <path d="M0,20 q15,-20 30,0 q15,20 30,0 q15,-20 30,0 q15,20 30,0 q15,-20 30,0 q15,20 30,0 q15,-20 30,0 q15,20 30,0 q15,-20 30,0 q15,20 30,0 q15,-20 30,0 q15,20 30,0 q15,-20 30,0 q15,20 30,0 q15,-20 30,0 q15,20 30,0 q15,-20 30,0 q15,20 30,0 q15,-20 30,0 q15,20 30,0 q15,-20 30,0 q15,20 30,0 q15,-20 30,0 q15,20 30,0 q15,-20 30,0 q15,20 30,0 q15,-20 30,0 q15,20 30,0 q15,-20 30,0 q15,20 30,0 q15,-20 30,0 q15,20 30,0" />
    </svg>
  </div>

  <section class="timeline" id="timeline">
    <div data-mount="timeline-head"></div>
    <div class="timeline__layout">

      <!-- Sticky year rail. main.js fills the year list from the entries. -->
      <aside class="rail" data-rail aria-hidden="true">
        <div class="rail__inner">
          <div class="rail__now">
            <span class="rail__now-label">Now viewing</span>
            <span class="rail__now-year" data-rail-year>2015</span>
          </div>
          <div class="rail__track">
            <div class="rail__line"><span class="rail__fill" data-rail-fill></span></div>
            <ol class="rail__years"></ol>
          </div>
        </div>
      </aside>

      <div data-mount="timeline-entries"></div>
    </div>
  </section>

  <div data-mount="angle"></div>
  <div data-mount="skills"></div>
  <div data-mount="facts"></div>
  <div data-mount="leadership"></div>
  <div data-mount="contact"></div>
